name: Backup Postgres

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar cliente de Postgres 18
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Dump de la base de datos
        run: |
          mkdir -p backups
          FILE="backups/backup-$(date +%Y-%m-%d).sql"
          /usr/lib/postgresql/18/bin/pg_dump "${{ secrets.DATABASE_UNPOOLED_URL }}" \
            --schema=public --no-owner --no-acl > "$FILE"
          # Verificación: debe tener contenido real y la tabla User
          test "$(wc -c < "$FILE")" -gt 10000
          grep -q 'CREATE TABLE public."User"' "$FILE"

      - name: Cifrar el backup
        run: |
          gpg --batch --yes --passphrase "${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}" \
            --symmetric --cipher-algo AES256 \
            backups/backup-$(date +%Y-%m-%d).sql
          rm backups/backup-$(date +%Y-%m-%d).sql

      - name: Commitear el backup al repo
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git commit -m "Backup automático $(date +%Y-%m-%d)" || echo "Sin cambios para commitear"
          git push

      - name: Borrar backups de más de 14 días
        run: |
          LIMITE=$(date -d '14 days ago' +%Y-%m-%d)
          for f in backups/backup-*.sql.gpg; do
            [ -e "$f" ] || continue
            dia=$(basename "$f" .sql.gpg | sed 's/^backup-//')
            if [[ "$dia" < "$LIMITE" ]]; then rm "$f"; fi
          done
          git add backups/
          git commit -m "Limpieza de backups viejos" || echo "Nada para limpiar"
          git push